name: Expo EAS Android Build

on:
  push:
    branches:
      - main
      - dev
      - backlog/*

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Setup Node with cache
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      # 3. Cache npm & Gradle
      - name: Cache npm & Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm/_npx
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Setup Expo & EAS CLI
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 6. Run EAS build (Android only)
      - name: Build Android APK
        id: eas-build
        run: |
          BUILD_URL=$(eas build --platform android --profile preview --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      # 7. Upload APK Artifact (versioned by branch + run number)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-${{ github.ref_name }}-b${{ github.run_number }}
          path: app-preview.apk

      # 8. Send Discord notification
      - name: Discord Notification
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            *Expo Android Build - Beta*
            Status: **${{ job.status }}**
            ━━━━━━━━━━━━━━━━━━
            **Download Artifact:** app-preview-${{ github.ref_name }}-b${{ github.run_number }}(https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ━━━━━━━━━━━━━━━━━━
            Message: ${{ github.event.head_commit.message }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
