name: Build Android App

on:
  push:
    branches: [dev, main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo Auth
        run: npx eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS
        run: npm run build-android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get latest build URL
        id: get-url
        run: |
          url=$(npx eas build:list --limit=1 --json | jq -r '.[0].artifacts.buildUrl')
          echo "APK_URL=$url" >> $GITHUB_ENV

      - name: Send Build Link to Discord
        run: |
          payload=$(jq -n --arg url "$APK_URL" \
            '{username: "CI/CD Bot", content: "New Android Build Ready!\nDownload here: \($url)"}')
          curl -H "Content-Type: application/json" \
            -d "$payload" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
        env:
          APK_URL: ${{ env.APK_URL }}
