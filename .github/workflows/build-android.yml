name: Expo EAS Build (Android Only)

on:
  push:
    branches:
      - main
      - dev
      - backlog/*

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Setup Node with cache
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      # 3. Cache extra dirs (expo, npm, gradle)
      - name: Cache Expo & Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.expo
            ~/.npm/_npx
            ~/.gradle/caches
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      # 4. Install deps
      - name: Install dependencies
        run: npm ci

      # 5. Setup EAS CLI
      - name: Setup EAS
        run: npm install -g eas-cli

      # 6. Run EAS build (Android only)
      - name: Build Android APK
        id: eas-build
        run: |
          BUILD_URL=$(eas build --platform android --profile preview --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from Expo
        run: |
          BUILD_URL="${{ steps.eas-build.outputs.build_url }}"
          echo "Downloading from $BUILD_URL"
          curl -L "$BUILD_URL" -o app-preview.apk

      # 8c. Upload as GitHub artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloraBit-apk
          path: app-preview.apk

      # 7. Send Discord notification
      - name: Discord Notification
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            *Iteration 2 Android Build - Beta*
            Status: **${{ job.status }}**

            ━━━━━━━━━━━━━━━━━━
            ⬇️ [Download here](${{ steps.eas-build.outputs.build_url }})
            ━━━━━━━━━━━━━━━━━━



            Message: ${{ github.event.head_commit.message }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
