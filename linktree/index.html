<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verde | Links</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #2ecc71, #27ae60);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        background: rgba(0, 0, 0, 0.2);
        padding: 2rem;
        border-radius: 12px;
        backdrop-filter: blur(6px);
      }
      a {
        display: block;
        margin: 0.6rem 0;
        padding: 0.8rem 1.2rem;
        border-radius: 8px;
        background: white;
        color: #2ecc71;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s, background 0.2s;
      }
      a:hover {
        background: #ecf0f1;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Verde</h1>
      <a href="https://github.com/Only-Bugs/Verde">GitHub Repo</a>
      <a href="mailto:pshashank0502@gmail.com">Email</a>
    </div>
  </body>
</html>
